services:
  postgresql:
    image: postgres:15
    container_name: ziaant-postgresql
    environment:
      POSTGRES_USER: ziaant
      POSTGRES_PASSWORD: ziaant123
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziaant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ziaant-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ziaant-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ziaant
      RABBITMQ_DEFAULT_PASS: ziaant123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ziaant-network

  eureka-server:
    build: ./eureka-server
    container_name: ziaant-eureka
    ports:
      - "8761:8761"
    # healthcheck supprimé temporairement pour éviter le blocage
    networks:
      - ziaant-network

  config-server:
    build: ./config-server
    container_name: ziaant-config
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - ziaant-network

  gateway-service:
    build: ./gateway-service
    container_name: ziaant-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - ziaant-network

  mailhog:
    image: mailhog/mailhog
    container_name: ziaant-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ziaant-network

  notification-service:
    build: ./services/notification-service
    container_name: ziaant-notification
    ports:
      - "8083:8083"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      GMAIL_APP_PASSWORD: "urthijivxdudkbtk"
    depends_on:
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - ziaant-network

  restaurant-service:
    build: ./services/restaurant-service
    container_name: ziaant-restaurant
    ports:
    - "8084:8084"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST: postgresql          # ← MANQUAIT
      DB_USERNAME: ziaant          # ← MANQUAIT
      DB_PASSWORD: ziaant123       # ← MANQUAIT
    depends_on:
      postgresql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - ziaant-network

volumes:
  postgres_data:

networks:
  ziaant-network:
    driver: bridge