version: '3.9'

services:

  postgresql:
    image: postgres:15
    container_name: ziaant-postgresql
    environment:
      POSTGRES_USER: ziaant
      POSTGRES_PASSWORD: ziaant123
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ziaant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziaant -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ziaant-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ziaant
      RABBITMQ_DEFAULT_PASS: ziaant123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ziaant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: ziaant-eureka
    ports:
      - "8761:8761"
    networks:
      - ziaant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build: ./services/auth-service
    container_name: ziaant-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ziaant
      SPRING_DATASOURCE_PASSWORD: ziaant123
    depends_on:
      postgresql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ziaant-network
    restart: on-failure

  reservation-service:
    build: ./services/reservation-service
    container_name: ziaant-reservation
    ports:
      - "8082:8082"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: ziaant
      SPRING_DATASOURCE_PASSWORD: ziaant123
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ziaant-network
    restart: on-failure

  restaurant-service:
    build: ./services/restaurant-service
    container_name: ziaant-restaurant
    ports:
      - "8083:8083"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/restaurant_db
      SPRING_DATASOURCE_USERNAME: ziaant
      SPRING_DATASOURCE_PASSWORD: ziaant123
    depends_on:
      postgresql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ziaant-network
    restart: on-failure

  notification-service:
    build: ./services/notification-service
    container_name: ziaant-notification
    ports:
      - "8084:8084"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ziaant-network
    restart: on-failure

  gateway-service:
    build: ./gateway-service
    container_name: ziaant-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - ziaant-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  ziaant-network:
    driver: bridge