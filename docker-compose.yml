version: '3.9'

services:

  postgresql:
    image: postgres:15
    container_name: ziaant-postgresql
    environment:
      POSTGRES_USER: ziaant
      POSTGRES_PASSWORD: ziaant123
      POSTGRES_DB: ziaant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ziaant-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ziaant-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ziaant
      RABBITMQ_DEFAULT_PASS: ziaant123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ziaant-network
    restart: unless-stopped

  eureka-server:
    build: ./eureka-server
    container_name: ziaant-eureka
    ports:
      - "8761:8761"
    networks:
      - ziaant-network
    restart: unless-stopped

  # MICROSERVICES 

  auth-service:
    build: ./services/auth-service
    container_name: ziaant-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/ziaant_db
      SPRING_DATASOURCE_USERNAME: ziaant
      SPRING_DATASOURCE_PASSWORD: ziaant123
    depends_on:
      - eureka-server
      - postgresql
    networks:
      - ziaant-network
    restart: unless-stopped

  reservation-service:
    build: ./services/reservation-service
    container_name: ziaant-reservation
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/ziaant_db
      SPRING_DATASOURCE_USERNAME: ziaant
      SPRING_DATASOURCE_PASSWORD: ziaant123
    depends_on:
      - eureka-server
      - postgresql
    networks:
      - ziaant-network
    restart: unless-stopped

  restaurant-service:
    build: ./services/restaurant-service
    container_name: ziaant-restaurant
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/ziaant_db
      SPRING_DATASOURCE_USERNAME: ziaant
      SPRING_DATASOURCE_PASSWORD: ziaant123
    depends_on:
      - eureka-server
      - postgresql
    networks:
      - ziaant-network
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: ziaant-notification
    ports:
      - "8084:8084"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - eureka-server
      - rabbitmq
    networks:
      - ziaant-network
    restart: unless-stopped

  # GATEWAY
  gateway-service:
    build: ./gateway-service
    container_name: ziaant-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - ziaant-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ziaant-network:
    driver: bridge