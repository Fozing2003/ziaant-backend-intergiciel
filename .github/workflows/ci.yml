name: CI/CD - Ziaant Backend
 
on:
  push:
    branches: [ main, auth-service, reservation-service, restaurant-service, notification-service ]
  pull_request:
    branches: [ main ]
 
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
 
jobs:
 
  # JOB 1 : Tests unitaires — un job par service
 
  test-eureka:
    name: "Tests - Eureka Server"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd eureka-server
          mvn test -B
 
  test-config:
    name: "Tests - Config Server"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd config-server
          mvn test -B
 
  test-gateway:
    name: "Tests - Gateway Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd gateway-service
          mvn test -B
 
  test-auth:
    name: "Tests - Auth Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd services/auth-service
          mvn test -B
 
  test-restaurant:
    name: "Tests - Restaurant Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd services/restaurant-service
          mvn test -B
 
  test-reservation:
    name: "Tests - Reservation Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd services/reservation-service
          mvn test -B
 
  test-notification:
    name: "Tests - Notification Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: |
          cd services/notification-service
          mvn test -B
 
  # JOB 2 : Build & Push images Docker (seulement sur main)
 
  build-and-push:
    name: "Build & Push Docker Images (${{ matrix.service }}, ${{ matrix.context }})"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - test-eureka
      - test-config
      - test-gateway
      - test-auth
      - test-restaurant
      - test-reservation
      - test-notification
 
    permissions:
      contents: read
      packages: write
 
    strategy:
      matrix:
        include:
          - service: eureka-server
            context: ./eureka-server
          - service: config-server
            context: ./config-server
          - service: gateway-service
            context: ./gateway-service
          - service: auth-service
            context: ./services/auth-service
          - service: restaurant-service
            context: ./services/restaurant-service
          - service: reservation-service
            context: ./services/reservation-service
          - service: notification-service
            context: ./services/notification-service
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
 
      - name: Build JAR
        run: |
          cd ${{ matrix.context }}
          mvn package -DskipTests -B
 
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Convert owner to lowercase
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ziaant-${{ matrix.service }}:latest
            ghcr.io/${{ steps.lowercase.outputs.owner }}/ziaant-${{ matrix.service }}:${{ github.sha }}
 