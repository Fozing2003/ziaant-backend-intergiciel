# Application
spring.application.name=restaurant-service
server.port=8084

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# PostgreSQL (utilise localhost pour dev local, postgresql pour Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/restaurant_db
spring.datasource.username=${DB_USERNAME:ziaant}
spring.datasource.password=${DB_PASSWORD:ziaant123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / SpringDoc
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true