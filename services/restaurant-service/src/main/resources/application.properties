# Application
spring.application.name=restaurant-service
server.port=8083

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/restaurant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ziaant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ziaant123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=${JWT_SECRET:ZiaantReserveTableCMSuperSecretKeyForJWT2025MustBe256BitsLong!}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:8083,http://localhost

# Actuator
management.endpoints.web.exposure.include=health,info
