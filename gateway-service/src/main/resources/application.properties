server.port=8080
spring.application.name=gateway-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT (meme secret que tous les services)
jwt.secret=${JWT_SECRET:ZiaantReserveTableCMSuperSecretKeyForJWT2025MustBe256BitsLong!}
security.internal-token=${INTERNAL_SERVICE_TOKEN:change-me-in-production}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ROUTES
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=reservation-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://reservation-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reservations/**

spring.cloud.gateway.server.webflux.routes[2].id=restaurant-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://restaurant-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/restaurants/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

# CORS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.ziaant=DEBUG
